# Source build of this checkout, layered on compose.yaml:
#   ./start.sh dev     or   docker compose -f compose.yaml -f compose.dev.yaml --profile platform up --build
# The fixed local tag keeps source builds from overwriting the pinned GHCR image.
services:
  platform:
    image: loopforge-platform:local
    build:
      context: .
      args:
        LOOPFORGE_BUILD_JOBS: ${LOOPFORGE_BUILD_JOBS:-}
        LOOPFORGE_COMMIT: ${LOOPFORGE_COMMIT:-}
    environment:
      AGENTFLOW_ISOLATED_IMAGE: loopforge-platform:local
      AGENTFLOW_A2A_RPC_URL: ${AGENTFLOW_A2A_RPC_URL:-}
      AGENTFLOW_A2A_TOKEN: ${AGENTFLOW_A2A_TOKEN:-}
      AGENTFLOW_WEB_CHAT_A2A_TOKEN: ${AGENTFLOW_WEB_CHAT_A2A_TOKEN:-}
      AGENTFLOW_WEB_CHAT_ROOM_A2A_RPC_URL: ${AGENTFLOW_WEB_CHAT_ROOM_A2A_RPC_URL:-}
      AGENTFLOW_WEB_CHAT_ROUTER_A2A_TOKEN: ${AGENTFLOW_WEB_CHAT_ROUTER_A2A_TOKEN:-}
      AGENTFLOW_WEB_CHAT_USER_IDS: ${AGENTFLOW_WEB_CHAT_USER_IDS:-}
      AGENTFLOW_WEB_CHAT_MAX_PENDING_PER_USER: ${AGENTFLOW_WEB_CHAT_MAX_PENDING_PER_USER:-}
      AGENTFLOW_WEB_CHAT_MAX_RUNNING_PER_USER: ${AGENTFLOW_WEB_CHAT_MAX_RUNNING_PER_USER:-}
      AGENTFLOW_CHAT_BRIDGE_PORT: ${AGENTFLOW_CHAT_BRIDGE_PORT:-}
      AGENTFLOW_CHAT_BRIDGE_ID: ${AGENTFLOW_CHAT_BRIDGE_ID:-}
      AGENTFLOW_CHAT_BRIDGE_TOKEN: ${AGENTFLOW_CHAT_BRIDGE_TOKEN:-}
      AGENTFLOW_CHAT_BRIDGE_SENDERS: ${AGENTFLOW_CHAT_BRIDGE_SENDERS:-}
      AGENTFLOW_CHAT_BRIDGE_GROUPS: ${AGENTFLOW_CHAT_BRIDGE_GROUPS:-}
